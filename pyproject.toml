[project]
name = "netscope-monitor"
version = "0.1.0"
description = "Local network performance workbench for Windows"
requires-python = ">=3.12,<3.15"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<0.29",
    "psutil>=7,<8",
    "scapy>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
[tool.uv]
package = false
[tool.ruff]
target-version = "py312"
line-length = 104
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
